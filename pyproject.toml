[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-scratch-manager"
version = "0.1.0"
description = "Policy-gated, metadata-first scratch inventory and optional verified access"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "hpc-scratch-manager contributors"}]
dependencies = []
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
hpc-scratch-manager = "hpc_scratch_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
